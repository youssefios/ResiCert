<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ResiCert Studio — RIBA stage-aware compliance decipher</title>
<style>
:root{
  --bg:#0f1419;--panel:#161c24;--panel-2:#1d2530;--panel-3:#222c38;--line:#2a3440;--ink:#e7edf3;--muted:#9fb0c0;
  --accent:#2f9e5e;--accent-2:#36b3ff;--warn:#e0a32e;--fail:#e0563f;--pass:#2f9e5e;--info:#6b7d8f;
  --radius:10px;--shadow:0 6px 24px rgba(0,0,0,.28);
}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.muted{color:var(--muted)}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.topbar{padding:14px 22px;background:linear-gradient(180deg,#18202b,#131922);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topline{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}.logo{font-size:28px}
.topbar h1{font-size:18px;margin:0}.tagline{margin:0;font-size:12px;color:var(--muted)}
.topbar-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
select,input,button{font:inherit;color:var(--ink);background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
select{max-width:240px}button.ghost{cursor:pointer}button.ghost:hover{filter:brightness(1.1)}
/* RIBA stepper */
.ribawrap{margin-top:14px}
.riba{display:flex;gap:6px}
.step{flex:1;cursor:pointer;border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;transition:.12s}
.step:hover{border-color:var(--accent-2)}
.step .snum{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:#243040;color:var(--muted)}
.step .sname{font-size:10.5px;color:var(--muted);text-align:center;line-height:1.1}
.step.done .snum{background:#1c3a29;color:#bff3d2}
.step.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.step.on .snum{background:var(--accent);color:#fff}.step.on .sname{color:var(--ink)}
@media(max-width:720px){.step .sname{display:none}}
.stagecard{margin-top:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:9px 13px}
/* summary */
.summary{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap;margin-top:12px}
.ov-card{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;display:flex;flex-direction:column;justify-content:center;min-width:150px}
.ov-card .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.ov-card .v{font-size:17px;font-weight:700}
.matbar{height:7px;background:#243040;border-radius:5px;overflow:hidden;margin-top:5px;width:150px}.matfill{height:100%;background:linear-gradient(90deg,var(--accent-2),var(--accent))}
.chips{display:flex;gap:8px;flex-wrap:wrap;flex:1}
.chip{cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:7px 12px;background:var(--panel-2);display:flex;align-items:center;gap:8px;min-width:155px}
.chip:hover{border-color:var(--accent-2)}.chip .ci{font-size:18px}
.chip .cmeta{display:flex;flex-direction:column;line-height:1.15}.chip .cname{font-size:12px;color:var(--muted)}.chip .cband{font-size:14px;font-weight:700}
.rankdot{margin-left:auto;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:14px;color:#06210f}
.band-A{background:#00855a;color:#fff}.band-B{background:#19b459}.band-C{background:#8dce46}.band-D{background:#fcaa65}.band-E{background:#ef8023;color:#fff}.band-F{background:#e9153b;color:#fff}.band-x{background:#3a4654;color:#cdd9e4}
main{max-width:1500px;margin:0 auto;padding:18px 22px;display:grid;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.card>header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--panel-3);cursor:pointer;border-bottom:1px solid var(--line)}
.card>header .hi{font-size:22px}.card>header h2{font-size:16px;margin:0}.card>header .hsub{font-size:12px;color:var(--muted)}
.card>header .hrank{margin-left:auto;display:flex;align-items:center;gap:10px}
.hrank .pill{font-size:11px;border-radius:999px;padding:2px 9px;border:1px solid var(--line)}
.pill.pass{background:#1c3a29;color:#bff3d2}.pill.warn{background:#3a3320;color:#f3e3b8}.pill.fail{background:#3a201c;color:#f4c2b8}.pill.x{background:#26313c;color:#9fb0c0}
.card .body{display:grid;grid-template-columns:1fr 1fr;gap:0}
@media(max-width:920px){.card .body{grid-template-columns:1fr}}
.inputs{padding:14px 16px;border-right:1px solid var(--line)}
@media(max-width:920px){.inputs{border-right:none;border-bottom:1px solid var(--line)}}
.results{padding:14px 16px;background:#141a22}
.subbox{border:1px solid var(--line);border-radius:8px;padding:6px 12px 12px;margin:10px 0;background:var(--panel-2);transition:.12s}
.subbox.ahead{opacity:.5}
.subbox>.sbhead{display:flex;align-items:center;gap:8px;margin:6px 0 2px}
.subbox>.sbhead .sbtitle{font-size:12px;font-weight:600;color:var(--accent-2);text-transform:uppercase;letter-spacing:.5px}
.sbstage{font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 7px;margin-left:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}@media(max-width:520px){.grid2{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:3px;margin:6px 0}.field label{font-size:12px;color:var(--muted)}
.field input[type=number],.field input[type=text],.field select{width:100%}
.field.check{flex-direction:row;align-items:center;gap:8px}.field.check label{font-size:13px;color:var(--ink)}.field.check input{width:auto}
.collapsed .body{display:none}.caret{transition:transform .15s}.collapsed .caret{transform:rotate(-90deg)}
.findings{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.finding{border:1px solid var(--line);border-left-width:4px;border-radius:8px;padding:8px 11px;background:var(--panel-2)}
.finding.pass{border-left-color:var(--pass)}.finding.fail{border-left-color:var(--fail)}.finding.warning{border-left-color:var(--warn)}.finding.info{border-left-color:var(--info)}.finding.not-applicable{border-left-color:#3a4654;opacity:.85}.finding.deferred{border-left-color:#3a4654;opacity:.6;border-style:dashed}
.finding .ftitle{font-weight:600;display:flex;justify-content:space-between;gap:8px;font-size:13px}
.status-tag{font-size:10px;text-transform:uppercase;letter-spacing:.5px;padding:1px 7px;border-radius:999px;white-space:nowrap}
.status-tag.pass{background:#1c3a29;color:#bff3d2}.status-tag.fail{background:#3a201c;color:#f4c2b8}.status-tag.warning{background:#3a3320;color:#f3e3b8}.status-tag.info{background:#26313c;color:#cdd9e4}.status-tag.not-applicable{background:#26313c;color:#9fb0c0}.status-tag.deferred{background:#26313c;color:#8ea2b4}
.finding .fdetail{font-size:12.5px;margin:3px 0 0}.finding .fmeta{font-size:11.5px;color:var(--muted);margin-top:3px}.finding .frec{font-size:11.5px;margin-top:3px;color:#cfe9d8}
.gatebadge{font-size:10px;color:#f4c2b8;border:1px solid #6e352f;border-radius:4px;padding:0 5px;margin-left:6px}
.rankhead{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.rankhead .big{width:52px;height:52px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:22px}
.rankhead .rmeta .rt{font-size:13px;font-weight:600}.rankhead .rmeta .rs{font-size:12px;color:var(--muted)}
.minibars{display:grid;gap:4px;margin:8px 0 12px}
.mb{display:grid;grid-template-columns:84px 1fr 40px;gap:8px;align-items:center;font-size:11px}
.mbtrack{height:8px;background:#243040;border-radius:5px;overflow:hidden}.mbfill{height:100%}
.na-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.na-pill{font-size:11px;border:1px dashed var(--line);border-radius:999px;padding:2px 9px;color:var(--muted)}
.sitefoot{max-width:1500px;margin:0 auto;padding:6px 22px 26px}.sitefoot p{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<header class="topbar">
  <div class="topline">
    <div class="brand"><span class="logo">🧭</span>
      <div><h1>ResiCert Studio</h1><p class="tagline">RIBA stage-aware, discipline-based building-regulations decipher — detail develops from Stage 0 to 6</p></div>
    </div>
    <div class="topbar-actions">
      <label for="sample" class="sr-only">Load example</label>
      <select id="sample" title="Load an example project"></select>
      <button class="ghost" id="expandAll">Expand all</button>
      <button class="ghost" id="collapseAll">Collapse all</button>
    </div>
  </div>
  <div class="ribawrap"><div class="riba" id="riba"></div><div class="stagecard" id="stagecard"></div></div>
  <div class="summary" id="summary"></div>
</header>
<main id="main"></main>
<footer class="sitefoot"><p id="disclaimer"></p></footer>

<script type="module">
/* ============================================================================
   ResiCert Studio — standalone, single-file, RIBA-stage-aware.
   Inputs grouped by stakeholder DISCIPLINE (Feasibility & Capital, Architecture,
   MEP, Structure & Fire, Sustainability/Energy, Planning). The RIBA Plan of Work
   stage (0 Strategic Definition → 6 Handover) controls which checks are in scope:
   early stages are dominated by feasibility/planning/capital, and technical
   Building-Regs detail comes into scope as the design matures. Each check is
   attributed to the responsible discipline and gives a live A–F rank.
   INDICATIVE only — not a SAP/EPC calc, viability appraisal or Building Control.
   ========================================================================== */

// ---------- helpers ----------
const clamp=(n,a,b)=>Math.min(b,Math.max(a,n));
const round=(n,dp=1)=>{const f=10**dp;return Math.round((n+Number.EPSILON)*f)/f;};
const savingPct=(base,des)=>!(base>0)?0:round(((base-des)/base)*100,1);
const epcBand=s=>s>=92?'A':s>=81?'B':s>=69?'C':s>=55?'D':s>=39?'E':s>=21?'F':'G';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const titleCase=s=>String(s).replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
const fmtM=v=>'£'+(v/1e6).toFixed(2)+'m';
/* finding. stage = RIBA stage from which it is in scope. gate:true = mandatory
   Building-Reg item whose (in-scope) failure blocks compliance. */
const F=(id,title,status,detail,x={})=>({id,title,status,detail,gate:false,stage:2,...x});

// ---------- RIBA Plan of Work 2020 ----------
const RIBA=[
 {n:0,name:'Strategic Definition',focus:'Is the project viable in planning & capital terms?',deliver:'Business case, options appraisal, strategic brief',milestone:'Client decision to proceed'},
 {n:1,name:'Preparation & Briefing',focus:'Confirm the brief, site constraints & sustainability aspirations',deliver:'Project brief, feasibility studies, site info, project budget',milestone:'Project Brief signed off'},
 {n:2,name:'Concept Design',focus:'Concept fabric/services/overheating strategy & planning approach',deliver:'Architectural concept, outline structural & MEP strategy, cost plan',milestone:'Concept Design signed off'},
 {n:3,name:'Spatial Coordination',focus:'Coordinate the disciplines and submit the planning application',deliver:'Coordinated, updated design; planning application',milestone:'Planning application submitted'},
 {n:4,name:'Technical Design',focus:'Full Building Regulations compliance & manufacturing information',deliver:'All technical/specification info; Building Regs submission',milestone:'Construction info / Building Regs'},
 {n:5,name:'Manufacturing & Construction',focus:'Build it; verify as-built performance on site',deliver:'Construction, site inspections, air test, commissioning',milestone:'Practical completion'},
 {n:6,name:'Handover',focus:'Hand over with as-built evidence and close out',deliver:'As-built info, as-built EPC, O&M, final certificates',milestone:'Handover & close-out'},
];

// ---------- domain model ----------
const OPT={
  nation:['england','wales','scotland','northern-ireland'],
  region:['london','south-east','south-west','east','east-midlands','west-midlands','yorkshire','north-west','north-east','wales','scotland','northern-ireland'],
  dwellingType:['house','flat','maisonette','bungalow'],
  builtForm:['detached','semi-detached','mid-terrace','end-terrace','apartment-block'],
  projectType:['new-build','major-refurbishment','change-of-use','extension'],
  heatingSystem:['gas-boiler','ashp','gshp','direct-electric','hydrogen-ready','heat-network','biomass'],
  ventilationSystem:['mvhr','mev','dev','natural'],
  primaryStructure:['masonry','timber-frame','clt','light-steel','icf'],
};
function defaultProject(){return{
  name:'Untitled scheme',reference:'',
  nation:'england',region:'south-east',dwellingType:'house',builtForm:'semi-detached',projectType:'new-build',
  waterStressedArea:false,units:1,storeys:2,topStoreyHeightM:5,bedrooms:3,bedspaces:5,gia:93,
  siteAreaHa:0.05,buildCostPerM2:2200,salesValuePerM2:4500,affordableHousingPct:0,
  uWall:0.18,uRoof:0.13,uFloor:0.13,uWindow:1.4,airPermeability:5,thermalBridging:0.05,glazingRatio:0.22,
  heatingSystem:'gas-boiler',ventilationSystem:'natural',waterUseLpd:125,pvKwp:0,batteryStorage:false,
  evChargePoint:true,gigabitInfrastructure:true,gigabitConnection:true,
  crossVentilation:true,solarShading:false,daylightFactorAvg:1.8,accessibleM4_2:false,wheelchairM4_3:false,
  pas24SecureDoors:true,separatingSoundDnTw:45,impactSoundLnTw:62,
  primaryStructure:'masonry',embodiedCarbonA1A5:700,responsiblySourcedMaterials:true,recycledContent:false,
  suds:false,rainwaterHarvesting:false,greywaterReuse:false,
  biodiversityNetGainPct:10,cycleStorage:true,parkingSpaces:2,
  sapEpcScore:null,targetCertifications:[],
};}
function normalise(input={}){
  const base=defaultProject(),out={...base};
  for(const k of Object.keys(base)){
    if(!(k in input))continue;const def=base[k],raw=input[k];
    if(raw===undefined||raw===null){if(k==='sapEpcScore')out[k]=null;continue;}
    if(typeof def==='number'){const n=Number(raw);out[k]=Number.isFinite(n)?n:def;}
    else if(typeof def==='boolean')out[k]=raw===true||raw==='true'||raw==='on'||raw===1||raw==='1';
    else if(Array.isArray(def))out[k]=Array.isArray(raw)?raw.map(String):String(raw).split(',').map(s=>s.trim()).filter(Boolean);
    else out[k]=String(raw);
  }
  return out;
}

// ---------- energy model (indicative) ----------
const HDD={london:2030,'south-east':2100,'south-west':2050,east:2200,'east-midlands':2300,'west-midlands':2300,yorkshire:2400,'north-west':2350,'north-east':2450,wales:2250,scotland:2650,'northern-ireland':2400};
const PVY={london:950,'south-east':980,'south-west':1000,east:970,'east-midlands':920,'west-midlands':910,yorkshire:880,'north-west':870,'north-east':860,wales:900,scotland:820,'northern-ireland':850};
const EXPF={detached:1,'semi-detached':.75,'end-terrace':.7,'mid-terrace':.55,'apartment-block':.5};
const CO2={electricity:.136,gas:.21,biomass:.029,'heat-network':.15};
const PE={electricity:1.501,gas:1.13,biomass:1.1,'heat-network':1.3};
const HEFF={'gas-boiler':.9,ashp:3,gshp:3.8,'direct-electric':1,'hydrogen-ready':.9,'heat-network':1,biomass:.85};
const HFUEL={'gas-boiler':'gas',ashp:'electricity',gshp:'electricity','direct-electric':'electricity','hydrogen-ready':'gas','heat-network':'heat-network',biomass:'biomass'};
const MVHR={mvhr:.88,mev:0,dev:0,natural:0};const SH=2.4;
function energy(p){
  const fp=p.gia/Math.max(1,p.storeys),side=Math.sqrt(Math.max(1,fp)),perim=4*side,exp=EXPF[p.builtForm]??.8;
  const grossWall=perim*SH*p.storeys*exp,glz=clamp(p.glazingRatio,0,.9)*p.gia,wall=Math.max(0,grossWall-glz);
  const deck=p.builtForm==='apartment-block'?.4:1,roof=fp*deck,floor=fp*deck,tot=wall+glz+roof+floor;
  const fab=p.uWall*wall+p.uWindow*glz+p.uRoof*roof+p.uFloor*floor+p.thermalBridging*tot;
  const vol=p.gia*SH,infil=p.airPermeability/20,rec=MVHR[p.ventilationSystem]??0,vent=.5*(1-rec),ventHLC=.33*(infil+vent)*vol;
  const hlc=fab+ventHLC,gross=(hlc*HDD[p.region]*24)/1000,util=clamp(.78-p.glazingRatio*.1,.6,.85),spaceHeat=gross*util;
  const dhw=p.bedspaces*1.1*365*1.15,eff=HEFF[p.heatingSystem]??1,fuel=HFUEL[p.heatingSystem]??'electricity';
  const delHeat=(spaceHeat+dhw)/eff,lightAux=9*p.gia**.5*5+p.gia*4,pv=p.pvKwp*(PVY[p.region]??900);
  let elec=lightAux,gas=0,other=0;
  if(fuel==='electricity')elec+=delHeat;else if(fuel==='gas')gas+=delHeat;else other+=delHeat;
  const selfUse=Math.min(elec,pv*.6),exp2=Math.max(0,pv-selfUse),netE=Math.max(0,elec-selfUse);
  const of=(fuel==='electricity'||fuel==='gas')?'electricity':fuel;
  const co2=netE*CO2.electricity+gas*CO2.gas+other*(CO2[of]??CO2.electricity)-exp2*CO2.electricity;
  const prim=netE*PE.electricity+gas*PE.gas+other*(PE[of]??PE.electricity)-exp2*PE.electricity;
  return{netElectricity:round(netE),gas:round(gas),exported:round(exp2),co2PerM2:round(co2/p.gia,1),primaryPerM2:round(prim/p.gia),
    eui:round((delHeat+lightAux)/p.gia,1),spaceHeatIntensity:round(spaceHeat/p.gia,1),fuel};
}
function epcOf(p,m){
  if(typeof p.sapEpcScore==='number'&&p.sapEpcScore>0){const s=clamp(p.sapEpcScore,1,100);return{score:round(s),band:epcBand(s),declared:true};}
  const cost=m.netElectricity*.27+m.gas*.07-m.exported*.05,cpm=cost/p.gia,score=clamp(Math.round(100-cpm*6),1,100);
  return{score,band:epcBand(score),declared:false};
}
function notional(p){return{...p,uWall:.18,uRoof:.11,uFloor:.13,uWindow:1.2,airPermeability:5,thermalBridging:.05,heatingSystem:'gas-boiler',pvKwp:round((p.gia/Math.max(1,p.storeys))*.04,2)};}
/* Resource efficiency vs UK benchmark (energy / water / embodied carbon). */
function efficiency(p,m){
  const EB={masonry:800,'light-steel':780,icf:760,'timber-frame':650,clt:600};
  const en=savingPct(130,m.eui);let w=p.waterUseLpd;if(p.rainwaterHarvesting)w*=.88;if(p.greywaterReuse)w*=.9;const wat=savingPct(150,w);
  const eb=EB[p.primaryStructure]??750;let e=p.embodiedCarbonA1A5;if(p.recycledContent)e*=.96;if(p.responsiblySourcedMaterials)e*=.99;const mat=savingPct(eb,e);
  return{pillars:{energy:{saving:en,baseline:130,design:m.eui,unit:'kWh/m²·yr'},water:{saving:wat,baseline:150,design:round(w,1),unit:'L/p·day'},materials:{saving:mat,baseline:eb,design:round(e),unit:'kgCO₂e/m²'}},zero:m.co2PerM2<=0};
}

// ---------- aspirational schemes (resi-gated voluntary certifications) ----------
const isMulti=p=>p.units>1||p.builtForm==='apartment-block'||p.dwellingType==='flat'||p.dwellingType==='maisonette';
const SCHEMES=[
 {id:'breeam',name:'BREEAM',test:()=>true},
 {id:'hqm',name:'Home Quality Mark',test:()=>true},
 {id:'passivhaus',name:'Passivhaus',test:()=>true},
 {id:'leed-residential',name:'LEED Residential',test:()=>true},
 {id:'well',name:'WELL',test:isMulti},
 {id:'fitwel',name:'Fitwel',test:isMulti},
 {id:'wiredscore-home',name:'WiredScore Home',test:isMulti},
 {id:'smartscore',name:'SmartScore',test:isMulti},
 {id:'building-with-nature',name:'Building with Nature',test:p=>p.units>=5},
 {id:'nabers-uk',name:'NABERS UK',test:()=>false},
];
function certs(p){const app=[],na=[];for(const s of SCHEMES)(s.test(p)?app:na).push(s.name);return{app,na};}

// ---------- discipline checks (each finding tagged with RIBA stage) ----------
function feasibility(p){
  const f=[],flats=p.dwellingType==='flat'||p.builtForm==='apartment-block';
  const totalGIA=p.gia*Math.max(1,p.units),saleable=totalGIA*(flats?0.82:0.9);
  const affFrac=clamp(p.affordableHousingPct/100,0,1),mktFrac=1-affFrac;
  const gdv=saleable*p.salesValuePerM2*(mktFrac+0.5*affFrac);
  const construction=p.buildCostPerM2*totalGIA,s106=p.units*15000;
  const devCost=construction*1.21+s106,profit=gdv*0.175,rlv=gdv-devCost-profit;
  let vs,vd;if(rlv>gdv*0.15){vs='pass';vd='Healthy residual land value with target developer profit retained.';}
  else if(rlv>0){vs='warning';vd='Marginal viability — residual land value is thin once target profit is taken.';}
  else{vs='fail';vd='Unviable on these inputs — costs plus target profit exceed GDV (negative residual land value).';}
  f.push(F('viability','Development viability',vs,`${vd} GDV ${fmtM(gdv)} · construction ${fmtM(construction)} · obligations ${fmtM(s106)} · target profit ${fmtM(profit)} (17.5% GDV) → residual land value ${fmtM(rlv)}.`,{stage:0,recommendation:vs==='pass'?undefined:'Revisit density/mix, value-engineer the build cost, or test the affordable %/obligations to restore viability.',reference:'Indicative residual appraisal — not investment advice'}));
  const dph=p.siteAreaHa>0?p.units/p.siteAreaHa:0,cap=flats?350:80;
  f.push(F('density','Density',dph>0?(dph<=cap?'pass':'warning'):'info',dph>0?`~${Math.round(dph)} dwellings/ha across ${p.units} unit(s) on ${p.siteAreaHa} ha.`:'Set a site area to assess density.',{stage:0,recommendation:dph>cap?'Check density against the local plan and townscape/character capacity.':undefined,reference:'Local plan density policy'}));

// ---------- stage gating + ranking ----------
function gateStage(findings,stage){return findings.map(f=>stage<(f.stage??2)?{...f,status:'deferred',orig:f.status}:f);}
function rank(findings){
  const c=findings.filter(f=>['pass','warning','fail'].includes(f.status));
  const counts={pass:0,warning:0,fail:0};for(const f of c)counts[f.status]++;
  const upcoming=findings.filter(f=>f.status==='deferred').length;
  const gateFail=findings.some(f=>f.gate&&f.status==='fail');
  if(!c.length)return{score:null,band:'x',label:upcoming?'Upcoming':'—',counts,gateFail:false,upcoming};
  const pts=c.reduce((a,f)=>a+(f.status==='pass'?1:f.status==='warning'?.5:0),0),score=Math.round(pts/c.length*100);
  let band;if(gateFail)band='F';else if(score>=90)band='A';else if(score>=75)band='B';else if(score>=60)band='C';else if(score>=40)band='D';else band='E';
  return{score,band,label:gateFail?'Non-compliant':'Band '+band,counts,gateFail,upcoming};
}

const DISCIPLINES=[
 {id:'feasibility',name:'Feasibility & Capital',icon:'💷',blurb:'Viability/residual value, density, affordable %, planning principle, capex',fn:p=>feasibility(p)},
 {id:'architecture',name:'Architecture',icon:'📐',blurb:'Fabric, glazing/overheating, space, access, acoustics, security, daylight',fn:p=>architecture(p)},
 {id:'mep',name:'MEP (M&E + Public Health)',icon:'⚙️',blurb:'Heating, ventilation, water, renewables, EV & connectivity',fn:p=>mep(p)},
 {id:'structure',name:'Structure & Fire',icon:'🏗️',blurb:'Structural system, fire safety, Reg 7, embodied carbon',fn:p=>structure(p)},
 {id:'sustainability',name:'Sustainability & Energy',icon:'🌿',blurb:'Part L target rates, EPC, resource efficiency, Future Homes Standard',fn:(p,m,e,g)=>sustainability(p,m,e,g)},
 {id:'planning',name:'Planning',icon:'🗺️',blurb:'BNG, SuDS, accessible mix, cycle, devolved standards',fn:p=>planning(p)},
];
function assess(input,stage){
  const p=normalise(input),m=energy(p),epc=epcOf(p,m),eff=efficiency(p,m);
  const raw={feasibility:feasibility(p),architecture:architecture(p),mep:mep(p),structure:structure(p),sustainability:sustainability(p,m,epc,eff),planning:planning(p)};
  const disc={};for(const k in raw)disc[k]=gateStage(raw[k],stage);
  const ranks={};for(const d of DISCIPLINES)ranks[d.id]=rank(disc[d.id]);
  const all=Object.values(disc).flat();
  const gateInScope=all.filter(f=>f.gate&&f.status!=='deferred');
  const gateFails=gateInScope.filter(f=>f.status==='fail');
  const techStarted=gateInScope.length>0,compliant=gateFails.length===0;
  const totalChecks=all.filter(f=>['pass','warning','fail','deferred'].includes(f.status)).length;
  const inScope=all.filter(f=>['pass','warning','fail'].includes(f.status)).length;
  const maturity=totalChecks?Math.round(inScope/totalChecks*100):0;
  const scored=Object.values(ranks).filter(r=>r.score!=null);
  const readiness=scored.length?Math.round(scored.reduce((a,r)=>a+r.score,0)/scored.length):0;
  let band;if(!compliant)band='F';else if(readiness>=90)band='A';else if(readiness>=75)band='B';else if(readiness>=60)band='C';else if(readiness>=40)band='D';else band='E';
  return{project:p,model:m,epc,eff,disc,ranks,compliant,gateFails,techStarted,maturity,readiness,band,certs:certs(p)};
}

};

// ---------- input layout: discipline -> [subcategory, ribaStage, fields] ----------
const CONTEXT=[['name','Project name','text'],['reference','Reference','text'],['nation','Nation','select'],['region','Region','select'],['projectType','Project type','select'],['dwellingType','Dwelling type','select'],['builtForm','Built form','select'],['units','Number of dwellings','number'],['storeys','Storeys','number'],['topStoreyHeightM','Top storey height (m)','number']];
const LAYOUT={
 feasibility:[
   ['Site & density',0,[['siteAreaHa','Site area (ha)','number']]],
   ['Capital & viability',0,[['buildCostPerM2','Build cost (£/m² GIA)','number'],['salesValuePerM2','Sales value / GDV (£/m²)','number']]],
   ['Planning & tenure',0,[['affordableHousingPct','Affordable housing (%)','number']]],
 ],
 architecture:[
   ['Wall & fabric build-up',2,[['uWall','Wall U-value (W/m²K)','number'],['uRoof','Roof U-value','number'],['uFloor','Floor U-value','number'],['uWindow','Window U-value','number'],['airPermeability','Air permeability (m³/h·m²)','number'],['thermalBridging','Thermal bridging (y)','number']]],
   ['Glazing & overheating',2,[['glazingRatio','Glazing ratio (0–1)','number'],['solarShading','Solar shading','check'],['crossVentilation','Cross ventilation','check']]],
   ['Space standards',1,[['gia','Gross internal area (m²)','number'],['bedrooms','Bedrooms','number'],['bedspaces','Bedspaces (persons)','number']]],
   ['Accessibility, acoustics & security',4,[['accessibleM4_2','M4(2) accessible','check'],['wheelchairM4_3','M4(3) wheelchair','check'],['separatingSoundDnTw','Separating airborne (dB)','number'],['impactSoundLnTw','Separating impact (dB)','number'],['pas24SecureDoors','PAS 24 secure doors','check'],['daylightFactorAvg','Avg daylight factor (%)','number']]],
 ],
 mep:[
   ['Heating & ventilation',2,[['heatingSystem','Heating system','select'],['ventilationSystem','Ventilation','select']]],
   ['Water efficiency',3,[['waterUseLpd','Water use (L/p/day)','number'],['waterStressedArea','Water-stressed area','check'],['rainwaterHarvesting','Rainwater harvesting','check'],['greywaterReuse','Greywater reuse','check']]],
   ['Renewables & electrical',2,[['pvKwp','Solar PV (kWp)','number'],['batteryStorage','Battery storage','check']]],
   ['EV & connectivity',3,[['parkingSpaces','Parking spaces','number'],['evChargePoint','EV charge point','check'],['gigabitInfrastructure','Gigabit infrastructure','check'],['gigabitConnection','Gigabit connection','check']]],
 ],
 structure:[
   ['Structural system',2,[['primaryStructure','Primary structure','select']]],
   ['Embodied carbon',2,[['embodiedCarbonA1A5','Embodied carbon A1–A5 (kgCO₂e/m²)','number'],['responsiblySourcedMaterials','Responsibly sourced','check'],['recycledContent','Recycled content','check']]],
   ['Fire (driven by height/form/type above)',2,[]],
 ],
 sustainability:[
   ['Evidence & targets',2,[['sapEpcScore','Declared SAP/EPC score (optional)','number']]],
   ['Aspirational certifications (resi-gated)',1,[['__certs','certs','certs']]],
 ],
 planning:[
   ['Ecology & drainage',2,[['biodiversityNetGainPct','Biodiversity Net Gain (%)','number'],['suds','Sustainable drainage','check']]],
   ['Transport',3,[['cycleStorage','Cycle storage','check']]],
 ],
};
const SCHEME_IDS=SCHEMES.map(s=>s.id);

// ---------- state ----------
let STAGE=2;
const DEFAULTS=defaultProject();

// ---------- build form ----------
function fieldEl(key,label,type,value){
  if(type==='certs'){
    const w=document.createElement('div');w.className='grid2';w.style.gridColumn='1 / -1';
    const tgt=new Set(value||[]);
    w.innerHTML=SCHEME_IDS.map(id=>`<div class="field check"><input type="checkbox" id="f_${id}" data-cert="${id}" ${tgt.has(id)?'checked':''}/><label for="f_${id}">${esc(titleCase(id))}</label></div>`).join('');
    return w;
  }
  const w=document.createElement('div');
  if(type==='check'){w.className='field check';w.innerHTML=`<input type="checkbox" id="f_${key}" data-key="${key}" ${value?'checked':''}/><label for="f_${key}">${esc(label)}</label>`;return w;}
  w.className='field';
  if(type==='select'){const o=(OPT[key]||[]).map(x=>`<option value="${x}" ${x===value?'selected':''}>${esc(titleCase(x))}</option>`).join('');w.innerHTML=`<label for="f_${key}">${esc(label)}</label><select id="f_${key}" data-key="${key}">${o}</select>`;}
  else{const t=type==='number'?'number':'text',step=type==='number'?'step="any"':'',v=value==null?'':value;w.innerHTML=`<label for="f_${key}">${esc(label)}</label><input type="${t}" ${step} id="f_${key}" data-key="${key}" value="${esc(v)}"/>`;}
  return w;
}
function subboxEl(title,stage,fields,vals){
  const b=document.createElement('div');b.className='subbox';b.dataset.stage=stage;
  b.innerHTML=`<div class="sbhead"><span class="sbtitle">${esc(title)}</span><span class="sbstage">RIBA ${stage}</span></div>`;
  if(!fields.length){b.innerHTML+=`<p class="muted" style="font-size:12px;margin:4px 0">No direct inputs — assessed from the project context above.</p>`;return b;}
  const g=document.createElement('div');g.className='grid2';
  for(const[k,l,t]of fields)g.appendChild(fieldEl(k,l,t,k==='__certs'?vals.targetCertifications:vals[k]));
  b.appendChild(g);return b;
}
function buildUI(vals){
  const main=document.getElementById('main');main.innerHTML='';
  const ctx=document.createElement('section');ctx.className='card';ctx.id='card-context';
  ctx.innerHTML=`<header data-toggle><span class="hi">🏠</span><div><h2>Project context</h2><div class="hsub">Shared parameters used across all disciplines (set at the outset)</div></div><span class="hrank"><span class="caret">▾</span></span></header>`;
  const cbody=document.createElement('div');cbody.className='body';cbody.style.gridTemplateColumns='1fr';
  const cin=document.createElement('div');cin.className='inputs';cin.style.borderRight='none';
  const cgrid=document.createElement('div');cgrid.className='grid2';
  for(const[k,l,t]of CONTEXT)cgrid.appendChild(fieldEl(k,l,t,vals[k]));
  cin.appendChild(cgrid);cbody.appendChild(cin);ctx.appendChild(cbody);main.appendChild(ctx);
  for(const d of DISCIPLINES){
    const card=document.createElement('section');card.className='card';card.id='card-'+d.id;
    card.innerHTML=`<header data-toggle><span class="hi">${d.icon}</span><div><h2>${esc(d.name)}</h2><div class="hsub">${esc(d.blurb)}</div></div><span class="hrank" id="rank-${d.id}"></span><span class="caret" style="margin-left:8px">▾</span></header>`;
    const body=document.createElement('div');body.className='body';
    const inp=document.createElement('div');inp.className='inputs';
    for(const[title,stage,fields]of LAYOUT[d.id])inp.appendChild(subboxEl(title,stage,fields,vals));
    const res=document.createElement('div');res.className='results';res.innerHTML=`<div id="rankhead-${d.id}"></div><ul class="findings" id="findings-${d.id}"></ul>`;
    body.appendChild(inp);body.appendChild(res);card.appendChild(body);main.appendChild(card);
  }
  main.querySelectorAll('[data-toggle]').forEach(h=>h.addEventListener('click',()=>h.parentElement.classList.toggle('collapsed')));
  main.querySelectorAll('[data-key],[data-cert]').forEach(el=>{el.addEventListener('input',recompute);el.addEventListener('change',recompute);});
  applyStageVisuals();
}
function readForm(){
  const out={};
  for(const el of document.querySelectorAll('[data-key]')){const k=el.dataset.key;if(el.type==='checkbox')out[k]=el.checked;else if(el.type==='number')out[k]=el.value===''?null:Number(el.value);else out[k]=el.value;}
  out.targetCertifications=[...document.querySelectorAll('[data-cert]')].filter(e=>e.checked).map(e=>e.dataset.cert);
  return out;
}

// ---------- RIBA stepper ----------
function buildRiba(){
  const r=document.getElementById('riba');
  r.innerHTML=RIBA.map(s=>`<button class="step ${s.n===STAGE?'on':''} ${s.n<STAGE?'done':''}" data-stage="${s.n}"><span class="snum">${s.n}</span><span class="sname">${esc(s.name)}</span></button>`).join('');
  r.querySelectorAll('[data-stage]').forEach(b=>b.addEventListener('click',()=>{STAGE=Number(b.dataset.stage);buildRiba();stageCard();applyStageVisuals();recompute();}));
}
function stageCard(){
  const s=RIBA[STAGE];
  document.getElementById('stagecard').innerHTML=`<div><strong>RIBA Stage ${s.n} — ${esc(s.name)}</strong> &nbsp;·&nbsp; <span class="muted">${esc(s.focus)}</span></div><div class="muted" style="font-size:12px;margin-top:2px">Key deliverables: ${esc(s.deliver)} &nbsp;·&nbsp; Milestone: ${esc(s.milestone)}</div>`;
}
function applyStageVisuals(){
  document.querySelectorAll('.subbox[data-stage]').forEach(b=>{
    const st=Number(b.dataset.stage),ahead=st>STAGE;
    b.classList.toggle('ahead',ahead);
    const old=b.querySelector('.aheadnote');if(old)old.remove();
    if(ahead){const n=document.createElement('div');n.className='aheadnote muted';n.style.fontSize='11px';n.style.margin='2px 0 4px';n.textContent='Typically defined ~RIBA '+st+' — provisional at this stage.';b.querySelector('.sbhead').after(n);}
  });
}

// ---------- render ----------
const sbar=(v,c)=>`<div class="mbtrack"><div class="mbfill" style="width:${clamp(v,0,100)}%;background:${c}"></div></div>`;
function fItem(f){
  if(f.status==='deferred')return`<li class="finding deferred"><div class="ftitle"><span>${esc(f.title)}${f.gate?'<span class="gatebadge">gate</span>':''}</span><span class="status-tag deferred">RIBA ${f.stage}+</span></div><p class="fdetail muted">Comes into scope at RIBA Stage ${f.stage} — not yet assessed.</p></li>`;
  return`<li class="finding ${f.status}"><div class="ftitle"><span>${esc(f.title)}${f.gate?'<span class="gatebadge">gate</span>':''}</span><span class="status-tag ${f.status}">${f.status.replace('-',' ')}</span></div><p class="fdetail">${esc(f.detail)}</p>${f.requirement?`<p class="fmeta">Req: ${esc(f.requirement)}</p>`:''}${f.recommendation?`<p class="frec">➤ ${esc(f.recommendation)}</p>`:''}${f.reference?`<p class="fmeta">Ref: ${esc(f.reference)}</p>`:''}</li>`;
}
function rankHead(d,r){
  const counts=`${r.counts.pass} pass · ${r.counts.warning} warning · ${r.counts.fail} fail${r.upcoming?` · ${r.upcoming} upcoming`:''}`;
  const sym=r.gateFail?'✕':(r.band==='x'?'…':r.band);
  return`<div class="rankhead"><div class="big band-${r.band}">${sym}</div><div class="rmeta"><div class="rt">${esc(d.name)} — ${r.gateFail?'Non-compliant':(r.score==null?r.label:r.label+' ('+r.score+'%)')}</div><div class="rs">${counts}${r.gateFail?' — a gated Building-Reg check is failing':''}</div></div></div>`;
}
function render(rep){
  const sum=document.getElementById('summary');
  const chips=DISCIPLINES.map(d=>{const r=rep.ranks[d.id];const sym=r.gateFail?'✕':(r.band==='x'?'…':r.band);return`<div class="chip" data-jump="${d.id}"><span class="ci">${d.icon}</span><span class="cmeta"><span class="cname">${esc(d.name.split(' (')[0])}</span><span class="cband">${r.gateFail?'Non-compliant':(r.score==null?r.label:'Band '+r.band)}</span></span><span class="rankdot band-${r.band}">${sym}</span></div>`;}).join('');
  const regCell=!rep.techStarted?`<span class="v" style="color:var(--muted)">Not yet in scope</span>`:(rep.compliant?`<span class="v" style="color:var(--pass)">✅ On track</span>`:`<span class="v" style="color:var(--fail)">❌ ${rep.gateFails.length} gate fail${rep.gateFails.length>1?'s':''}</span>`);
  sum.innerHTML=`<div class="ov-card"><span class="k">Building Regs (in scope)</span>${regCell}<span class="muted" style="font-size:11px">${rep.techStarted?'assessing technical gates':'technical detail from RIBA 4'}</span></div>
   <div class="ov-card"><span class="k">Readiness</span><span class="v"><span class="rankdot band-${rep.band}" style="display:inline-grid;width:24px;height:24px;vertical-align:middle">${rep.compliant?rep.band:'✕'}</span> ${rep.compliant?rep.readiness+'%':'blocked'}</span></div>
   <div class="ov-card"><span class="k">Design maturity</span><span class="v">${rep.maturity}%</span><div class="matbar"><div class="matfill" style="width:${rep.maturity}%"></div></div></div>
   <div class="ov-card"><span class="k">EPC · operational</span><span class="v">${rep.epc.band} · ${rep.eff.zero?'net-zero':rep.model.co2PerM2+' kg/m²'}</span></div>
   <div class="chips">${chips}</div>`;
  sum.querySelectorAll('[data-jump]').forEach(c=>c.addEventListener('click',()=>{const card=document.getElementById('card-'+c.dataset.jump);card.classList.remove('collapsed');card.scrollIntoView({behavior:'smooth',block:'start'});}));
  for(const d of DISCIPLINES){
    const r=rep.ranks[d.id];
    document.getElementById('rank-'+d.id).innerHTML=`<span class="pill ${r.gateFail||r.counts.fail?'fail':r.counts.warning?'warn':r.score==null?'x':'pass'}">${r.gateFail?'Non-compliant':(r.score==null?r.label:r.band+' · '+r.score+'%')}</span>`;
    let head=rankHead(d,r);
    if(d.id==='sustainability'){const e=rep.eff.pillars;head+=`<div class="minibars">
      <div class="mb"><span>Energy</span>${sbar(e.energy.saving,e.energy.saving>=20?'var(--accent)':'var(--warn)')}<span>${e.energy.saving}%</span></div>
      <div class="mb"><span>Water</span>${sbar(e.water.saving,e.water.saving>=20?'var(--accent)':'var(--warn)')}<span>${e.water.saving}%</span></div>
      <div class="mb"><span>Embodied C</span>${sbar(e.materials.saving,e.materials.saving>=20?'var(--accent)':'var(--warn)')}<span>${e.materials.saving}%</span></div></div>
      <p class="muted" style="font-size:12px">Applicable schemes: ${rep.certs.app.map(esc).join(', ')}.<span class="na-list">${rep.certs.na.map(n=>`<span class="na-pill">${esc(n)} — N/A</span>`).join('')}</span></p>`;}
    document.getElementById('rankhead-'+d.id).innerHTML=head;
    document.getElementById('findings-'+d.id).innerHTML=rep.disc[d.id].map(fItem).join('');
  }
}
function recompute(){render(assess(readForm(),STAGE));}

// ---------- boot ----------
buildRiba();stageCard();buildUI(DEFAULTS);
const sel=document.getElementById('sample');
sel.innerHTML='<option value="">— load an example —</option>'+Object.entries(SAMPLES).map(([k,v])=>`<option value="${k}">${esc(v.name||k)}</option>`).join('');
sel.addEventListener('change',()=>{if(SAMPLES[sel.value]){buildUI({...DEFAULTS,...SAMPLES[sel.value]});recompute();}});
document.getElementById('expandAll').addEventListener('click',()=>document.querySelectorAll('.card').forEach(c=>c.classList.remove('collapsed')));
document.getElementById('collapseAll').addEventListener('click',()=>document.querySelectorAll('.card').forEach(c=>c.classList.add('collapsed')));
document.getElementById('disclaimer').textContent='ResiCert Studio — indicative, RIBA stage-aware, discipline-based pre-assessment for early design & education. Checks come into scope as the design matures (Stage 0 feasibility → Stage 4 technical Building Regs → Stage 6 as-built). "Gate" checks are mandatory Building-Regs items whose in-scope failure blocks compliance. Not a SAP/EPC calc, viability appraisal or Building Control sign-off. Verify against current local requirements.';
recompute();
</script>
</body>
</html>
